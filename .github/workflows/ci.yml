name: ci

# The QEMU lab on an amd64 runner: GitHub's standard Linux runners expose
# KVM, so the same tasks that prove the baseline on the arm64 lab locally
# prove it on amd64 here — continuously, with no secrets and no billable
# resources. The real-provider leg (datasource, provider image quirks)
# stays with the operator's DigitalOcean harness (RFC-009).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    name: baseline + examples on the amd64 lab
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Open /dev/kvm to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and seed tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils genisoimage

      - name: Install ansible-core
        run: pipx install ansible-core

      - uses: jdx/mise-action@v2
        with:
          install: false

      - name: test:adoption-verdicts — every refusal class against fixtures, before any VM
        run: mise run test:adoption-verdicts

      - name: test:render — every input guard of the cloud-init render
        run: mise run test:render

      - name: Cache the Ubuntu cloud image
        uses: actions/cache@v4
        with:
          path: .generated/qemu/cache
          key: qemu-image-noble-amd64-v1

      - name: Cache the stale point-release image (test:patch, main only)
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: .generated/qemu/cache
          key: qemu-image-stale-release-20250805-amd64

      - name: fetch-image — warm the image cache
        run: mise run vm:fetch-image

      - name: up — create, boot, ride out first boot, converge
        run: mise run up

      - name: test:examples — every example twice, second pass changed=0
        run: mise run test:examples

      - name: test:rotation — both accounts re-keyed and back (main only)
        if: github.event_name != 'pull_request'
        run: mise run test:rotation

      - name: test:adoption — both rehearsals end to end (main only)
        if: github.event_name != 'pull_request'
        run: mise run test:adoption

      - name: test:adoption-refusals — the unadoptable server, refused with nothing added (main only)
        if: github.event_name != 'pull_request'
        run: mise run test:adoption-refusals

      - name: test:patch — a stale server adopted, patched, gate-rebooted (main only)
        if: github.event_name != 'pull_request'
        run: mise run test:patch

      - name: test:lock-refusals — every lock refusal, no door closes (main only)
        if: github.event_name != 'pull_request'
        run: mise run test:lock-refusals

      - name: test:reboot-refusal — the gate refuses a broken host, passes it healed (main only)
        if: github.event_name != 'pull_request'
        run: mise run test:reboot-refusal

      - name: test:lock-bystanders — one lock never strips the others' sudo (main only)
        if: github.event_name != 'pull_request'
        run: mise run test:lock-bystanders

      - name: Console log on failure
        if: failure()
        run: tail -n 200 .generated/qemu/vm/console.log 2>/dev/null || true
