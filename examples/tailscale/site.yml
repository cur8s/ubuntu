---
# Tailscale: install from the vendor apt repository, then join a tailnet
# with SSH enabled — a working sketch of the management-network access
# layer (docs/notes/management-network.md).
#
# Techniques demonstrated:
#   - vendor-hosted keyring and .list files fetched directly (Tailscale
#     publishes both; no dearmoring needed)
#   - secret input via environment variable with no_log (TAILSCALE_AUTHKEY;
#     secrets are the consumer's concern, never the collection's — RFC-004)
#   - stateful idempotent join: probe state, require the secret only when
#     actually needed, act only on divergence, assert the outcome
#
# Layer example (RFC-001): the baseline is enforced first, then the layer
# is applied. Run against the lab VM:
#   TAILSCALE_AUTHKEY="$(op read 'op://devops/ubuntu-tailscale-auth-key/password')" \
#     mise run test:tailscale
- name: Enforce the baseline
  ansible.builtin.import_playbook: cur8s.ubuntu.converge

- name: Install Tailscale
  hosts: all
  remote_user: ansible
  become: true
  gather_facts: false

  vars:
    ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"

  tasks:
    - name: Ensure apt transport dependencies are present
      ansible.builtin.apt:
        name:
          - ca-certificates
        state: present

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Trust packages signed by Tailscale
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"

    - name: Add Tailscale apt repository
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list
        dest: /etc/apt/sources.list.d/tailscale.list
        owner: root
        group: root
        mode: "0644"

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Enable and start Tailscale daemon
      ansible.builtin.systemd_service:
        name: tailscaled.service
        enabled: true
        state: started

    - name: Enable Tailscale client auto-updates
      ansible.builtin.command: tailscale set --auto-update
      changed_when: false

    - name: Read Tailscale preferences
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_preferences
      changed_when: false

    - name: Assert Tailscale auto-updates are enabled
      ansible.builtin.assert:
        that:
          - (tailscale_preferences.stdout | from_json).AutoUpdate.Check
          - (tailscale_preferences.stdout | from_json).AutoUpdate.Apply

    - name: Validate Tailscale command is available
      ansible.builtin.command: tailscale version
      changed_when: false

- name: Join the tailnet
  hosts: all
  remote_user: ansible
  become: true
  gather_facts: false

  vars:
    ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"
    tailscale_authkey: "{{ lookup('ansible.builtin.env', 'TAILSCALE_AUTHKEY') }}"
    tailscale_up_args:
      - --ssh
      - --accept-dns=false

  tasks:
    - name: Read Tailscale status
      ansible.builtin.command: tailscale status --json
      register: tailscale_status_raw
      failed_when: false
      changed_when: false

    - name: Initialize Tailscale status
      ansible.builtin.set_fact:
        tailscale_status: {}

    - name: Parse Tailscale status
      ansible.builtin.set_fact:
        tailscale_status: "{{ tailscale_status_raw.stdout | from_json }}"
      when:
        - tailscale_status_raw.rc == 0
        - (tailscale_status_raw.stdout | trim) is match('^\\{')

    - name: Determine whether host is joined to Tailscale
      ansible.builtin.set_fact:
        tailscale_joined: "{{ (tailscale_status.BackendState | default('')) == 'Running' }}"

    - name: Require Tailscale auth key when host is not joined
      ansible.builtin.assert:
        that:
          - tailscale_authkey | length > 0
        fail_msg: >-
          Host is not joined to Tailscale and no TAILSCALE_AUTHKEY was
          provided. Set it before running, e.g.
          TAILSCALE_AUTHKEY="$(op read 'op://devops/ubuntu-tailscale-auth-key/password')"
          mise run test:tailscale
      when: not tailscale_joined

    - name: Read Tailscale preferences before join
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_preferences_before
      changed_when: false
      when: tailscale_joined

    - name: Determine whether Tailscale SSH is enabled
      ansible.builtin.set_fact:
        tailscale_ssh_enabled_before: "{{ (tailscale_preferences_before.stdout | from_json).RunSSH }}"
      when: tailscale_joined

    - name: Enable Tailscale SSH on already joined hosts
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - --ssh
      changed_when: true
      when:
        - tailscale_joined
        - not tailscale_ssh_enabled_before

    - name: Join Tailscale with auth key
      ansible.builtin.command:
        argv: "{{ ['tailscale', 'up', '--auth-key=' + tailscale_authkey] + tailscale_up_args }}"
      changed_when: true
      no_log: true
      when: not tailscale_joined

    - name: Wait for Tailscale to be running
      ansible.builtin.command: tailscale wait --timeout=60s
      changed_when: false

    - name: Read Tailscale status after convergence
      ansible.builtin.command: tailscale status --json
      register: tailscale_status_after_raw
      changed_when: false

    - name: Parse Tailscale status after convergence
      ansible.builtin.set_fact:
        tailscale_status_after: "{{ tailscale_status_after_raw.stdout | from_json }}"

    - name: Assert host is joined to Tailscale
      ansible.builtin.assert:
        that:
          - (tailscale_status_after.BackendState | default('')) == 'Running'

    - name: Read Tailscale preferences after convergence
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_preferences_after
      changed_when: false

    - name: Assert Tailscale SSH is enabled
      ansible.builtin.assert:
        that:
          - (tailscale_preferences_after.stdout | from_json).RunSSH
