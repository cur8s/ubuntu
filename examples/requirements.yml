---
# Install cur8s.ubuntu from its git repository (RFC-009: Release and
# Versioning). main is the prod release; once release tags exist, pin one
# (e.g. version: v24.4.0) for reproducible installs and rollback.
collections:
  - name: https://github.com/cur8s/ubuntu.git#/collection/
    type: git
    version: main
