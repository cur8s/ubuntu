# Minimal consumer playbook: re-assert the baseline floor, then layer your
# own plays after it. Every tier re-asserts the floor (RFC-001), so this
# import comes first, always.
- name: Converge the baseline floor
  ansible.builtin.import_playbook: baseline.ubuntu.converge

