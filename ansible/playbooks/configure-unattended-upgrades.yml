---
- name: Configure Ubuntu unattended package maintenance
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true

    - name: Enable periodic unattended package maintenance
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Limit unattended upgrades to supported Ubuntu maintenance pockets
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51cur8s-unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}";
              "${distro_id}:${distro_codename}-security";
              "${distro_id}:${distro_codename}-updates";
          };
          Unattended-Upgrade::Automatic-Reboot "false";

    - name: Enable apt package maintenance timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

    - name: Read effective apt automatic maintenance configuration
      ansible.builtin.command: apt-config dump
      register: apt_config
      changed_when: false

    - name: Assert unattended package maintenance is enabled
      ansible.builtin.assert:
        that:
          - "'APT::Periodic::Update-Package-Lists \"1\";' in apt_config.stdout_lines"
          - "'APT::Periodic::Unattended-Upgrade \"1\";' in apt_config.stdout_lines"
          - "'Unattended-Upgrade::Allowed-Origins:: \"${distro_id}:${distro_codename}\";' in apt_config.stdout_lines"
          - "'Unattended-Upgrade::Allowed-Origins:: \"${distro_id}:${distro_codename}-security\";' in apt_config.stdout_lines"
          - "'Unattended-Upgrade::Allowed-Origins:: \"${distro_id}:${distro_codename}-updates\";' in apt_config.stdout_lines"

    - name: Validate apt package maintenance timers are enabled
      ansible.builtin.command: systemctl is-enabled "{{ item }}"
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      changed_when: false

    - name: Validate unattended-upgrade command is available
      ansible.builtin.command: unattended-upgrade --help
      changed_when: false
