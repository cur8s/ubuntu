---
- name: Update Ubuntu packages without rebooting
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 300

    - name: Upgrade installed Ubuntu packages
      ansible.builtin.apt:
        upgrade: "yes"
        lock_timeout: 300

    - name: Check whether Ubuntu requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report pending reboot requirement
      ansible.builtin.debug:
        msg: "Ubuntu package updates require a reboot; run the reboot-if-needed playbook when ready."
      when: reboot_required.stat.exists
