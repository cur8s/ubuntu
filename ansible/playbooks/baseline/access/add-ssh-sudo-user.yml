---
- name: Add baseline SSH sudo user
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # ==========================================================================
    # Inputs
    # ==========================================================================
    - name: Check user name
      ansible.builtin.assert:
        that:
          - user_name | default("") | length > 0
        fail_msg: "Set user_name."

    - name: Check public key file path
      ansible.builtin.assert:
        that:
          - public_key_file | default("") | length > 0
        fail_msg: "Set public_key_file for {{ user_name }}."

    - name: Load public key from controller
      ansible.builtin.set_fact:
        public_key: "{{ lookup('ansible.builtin.file', public_key_file) | trim }}"

    # ==========================================================================
    # User Account
    # ==========================================================================
    - name: Add passwordless sudo user
      ansible.builtin.import_tasks: tasks/add-passwordless-sudo-user.yml

    # ==========================================================================
    # SSH Access
    # ==========================================================================
    - name: Install Ed25519 authorized key
      ansible.builtin.import_tasks: tasks/install-ed25519-authorized-key.yml
