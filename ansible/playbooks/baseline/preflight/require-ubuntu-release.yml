---
- name: Require supported Ubuntu release
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Assert host runs Ubuntu 24.04 noble
      ansible.builtin.assert:
        that:
          - (ansible_facts["distribution"] | default("")) == "Ubuntu"
          - (ansible_facts["distribution_version"] | default("")) == "24.04"
          - (ansible_facts["distribution_release"] | default("")) == "noble"
        fail_msg: >-
          Host must run Ubuntu 24.04 LTS (noble);
          found {{ ansible_facts["distribution"] | default("unknown") }}
          {{ ansible_facts["distribution_version"] | default("unknown") }}
          ({{ ansible_facts["distribution_release"] | default("unknown") }}).
        success_msg: "Host runs Ubuntu 24.04 LTS (noble)."
