---
# ==========================================================================
# Inputs
# ==========================================================================
- name: Check user name
  ansible.builtin.assert:
    that:
      - user_name | default("") | length > 0
    fail_msg: "Set user_name."

# ==========================================================================
# User Account
# ==========================================================================
- name: Create user
  ansible.builtin.user:
    name: "{{ user_name }}"
    state: present
    shell: /bin/bash
    create_home: true
    password_lock: true

- name: Install passwordless sudo rule
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      {{ user_name }} ALL=(ALL) NOPASSWD:ALL

# ==========================================================================
# Verification
# ==========================================================================
- name: Verify passwordless sudo
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ user_name }}"
      - sudo
      - -n
      - /usr/bin/true
  changed_when: false
