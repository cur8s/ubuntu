---
- name: Ensure baseline access users exist
  hosts: all
  become: true
  gather_facts: false

  vars:
    baseline_access_users:
      - name: ansible
        public_key_file: "{{ baseline_ansible_public_key_file | default(lookup('ansible.builtin.env', 'ANSIBLE_SSH_PUBLIC_KEY_RENDERED'), true) }}"
      - name: admin
        public_key_file: "{{ baseline_admin_public_key_file | default(lookup('ansible.builtin.env', 'ADMIN_USER_SSH_PUBLIC_KEY_RENDERED'), true) }}"
    baseline_ssh_public_key_pattern: '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)) [A-Za-z0-9+/]+={0,3}( .*)?$'

  tasks:
    - name: Require baseline access user public key file paths
      ansible.builtin.assert:
        that:
          - item.public_key_file | length > 0
        fail_msg: "Set the rendered SSH public key file path for {{ item.name }}."
      loop: "{{ baseline_access_users }}"

    - name: Read baseline access user SSH public keys
      ansible.builtin.set_fact:
        baseline_access_user_public_keys: >-
          {{
            baseline_access_user_public_keys | default({}) |
            combine({item.name: lookup('ansible.builtin.file', item.public_key_file) | trim})
          }}
      loop: "{{ baseline_access_users }}"

    - name: Assert baseline access user SSH public key formats
      ansible.builtin.assert:
        that:
          - baseline_access_user_public_keys[item.name] is match(baseline_ssh_public_key_pattern)
        fail_msg: "Rendered SSH public key for {{ item.name }} is not a supported OpenSSH public key."
      loop: "{{ baseline_access_users }}"

    - name: Ensure baseline access users exist
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true
        password: "!"
        update_password: on_create
      loop: "{{ baseline_access_users }}"

    - name: Ensure baseline access user SSH directories exist
      ansible.builtin.file:
        path: "/home/{{ item.name }}/.ssh"
        state: directory
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: "0700"
      loop: "{{ baseline_access_users }}"

    - name: Ensure baseline access user authorized keys files exist
      ansible.builtin.copy:
        dest: "/home/{{ item.name }}/.ssh/authorized_keys"
        content: ""
        force: false
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: "0600"
      loop: "{{ baseline_access_users }}"

    - name: Ensure baseline access user SSH keys are authorized
      ansible.builtin.lineinfile:
        path: "/home/{{ item.name }}/.ssh/authorized_keys"
        line: "{{ baseline_access_user_public_keys[item.name] }}"
        state: present
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: "0600"
      loop: "{{ baseline_access_users }}"

    - name: Configure passwordless sudo for baseline access users
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/cur8s-{{ item.name }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: |
          {{ item.name }} ALL=(ALL) NOPASSWD:ALL
      loop: "{{ baseline_access_users }}"

    - name: Read baseline access user authorized keys
      ansible.builtin.slurp:
        src: "/home/{{ item.name }}/.ssh/authorized_keys"
      register: baseline_access_authorized_keys
      loop: "{{ baseline_access_users }}"

    - name: Assert baseline access user SSH keys are authorized
      ansible.builtin.assert:
        that:
          - baseline_access_user_public_keys[item.item.name] in (item.content | b64decode)
      loop: "{{ baseline_access_authorized_keys.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Validate passwordless sudo for baseline access users
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - -u
          - "{{ item.name }}"
          - sudo
          - -n
          - /usr/bin/true
      changed_when: false
      loop: "{{ baseline_access_users }}"
