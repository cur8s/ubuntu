---
- name: Configure Ubuntu unattended package maintenance
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true

    - name: Enable periodic unattended package maintenance
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Configure unattended-upgrades reboot policy
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51cur8s-unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          Unattended-Upgrade::Automatic-Reboot "false";

    - name: Enable apt package maintenance timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

    - name: Read effective apt automatic maintenance configuration
      ansible.builtin.command: apt-config dump
      register: apt_config
      changed_when: false

    - name: Assert unattended package maintenance is enabled
      ansible.builtin.assert:
        that:
          - "'APT::Periodic::Update-Package-Lists \"1\";' in apt_config.stdout_lines"
          - "'APT::Periodic::Unattended-Upgrade \"1\";' in apt_config.stdout_lines"
          - "'Unattended-Upgrade::Automatic-Reboot \"false\";' in apt_config.stdout_lines"

    - name: Validate apt package maintenance timers are enabled
      ansible.builtin.command: systemctl is-enabled "{{ item }}"
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      changed_when: false

    - name: Validate apt package maintenance timers are active
      ansible.builtin.command: systemctl is-active "{{ item }}"
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      changed_when: false

    - name: Read scheduled apt package maintenance timers
      ansible.builtin.command: systemctl list-timers apt-daily.timer apt-daily-upgrade.timer --no-pager --no-legend
      register: apt_timers
      changed_when: false

    - name: Assert apt package maintenance timers have scheduled runs
      ansible.builtin.assert:
        that:
          - "'apt-daily.timer' in apt_timers.stdout"
          - "'apt-daily-upgrade.timer' in apt_timers.stdout"

    - name: Validate unattended-upgrades dry run
      ansible.builtin.command: unattended-upgrade --dry-run --debug
      changed_when: false
