---
- name: Join Tailscale example management network
  hosts: all
  become: true
  gather_facts: false

  vars:
    tailscale_authkey: "{{ lookup('ansible.builtin.env', 'TAILSCALE_AUTHKEY') }}"
    tailscale_up_args:
      - --ssh
      - --accept-dns=false

  tasks:
    - name: Read Tailscale status
      ansible.builtin.command: tailscale status --json
      register: tailscale_status_raw
      failed_when: false
      changed_when: false

    - name: Initialize Tailscale status
      ansible.builtin.set_fact:
        tailscale_status: {}

    - name: Parse Tailscale status
      ansible.builtin.set_fact:
        tailscale_status: "{{ tailscale_status_raw.stdout | from_json }}"
      when:
        - tailscale_status_raw.rc == 0
        - (tailscale_status_raw.stdout | trim) is match('^\\{')

    - name: Determine whether host is joined to Tailscale
      ansible.builtin.set_fact:
        tailscale_joined: "{{ (tailscale_status.BackendState | default('')) == 'Running' }}"

    - name: Require Tailscale auth key when host is not joined
      ansible.builtin.assert:
        that:
          - tailscale_authkey | length > 0
        fail_msg: >-
          Host is not joined to Tailscale and no TAILSCALE_AUTHKEY was provided.
          Run through `mise run test-vm-converge`, or set TAILSCALE_AUTHKEY
          before invoking ansible-playbook directly.
      when: not tailscale_joined

    - name: Read Tailscale preferences before join
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_preferences_before
      changed_when: false
      when: tailscale_joined

    - name: Determine whether Tailscale SSH is enabled
      ansible.builtin.set_fact:
        tailscale_ssh_enabled_before: "{{ (tailscale_preferences_before.stdout | from_json).RunSSH }}"
      when: tailscale_joined

    - name: Enable Tailscale SSH on already joined hosts
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - --ssh
      changed_when: true
      when:
        - tailscale_joined
        - not tailscale_ssh_enabled_before

    - name: Join Tailscale with auth key
      ansible.builtin.command:
        argv: "{{ ['tailscale', 'up', '--auth-key=' + tailscale_authkey] + tailscale_up_args }}"
      changed_when: true
      no_log: true
      when: not tailscale_joined

    - name: Wait for Tailscale to be running
      ansible.builtin.command: tailscale wait --timeout=60s
      changed_when: false

    - name: Read Tailscale status after convergence
      ansible.builtin.command: tailscale status --json
      register: tailscale_status_after_raw
      changed_when: false

    - name: Parse Tailscale status after convergence
      ansible.builtin.set_fact:
        tailscale_status_after: "{{ tailscale_status_after_raw.stdout | from_json }}"

    - name: Assert host is joined to Tailscale
      ansible.builtin.assert:
        that:
          - (tailscale_status_after.BackendState | default('')) == 'Running'

    - name: Read Tailscale preferences after convergence
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_preferences_after
      changed_when: false

    - name: Assert Tailscale SSH is enabled
      ansible.builtin.assert:
        that:
          - (tailscale_preferences_after.stdout | from_json).RunSSH
