---
# RFC-007's stale-rotation sentence as an executable case: the account
# holds a previous baseline key that has since been rotated away. An old
# key is still a door someone may hold — it reads as unexpected on
# purpose; remove it, then re-assess.
case_observations:
  distribution: Ubuntu
  distribution_version: "24.04"
  sshd_include_found: true
  sudoers_include_found: true
  password_auth_enabled: false
  competing_dropins: []
  reboot_pending: false
  accounts:
    ansible: { exists: true, key_lines: ["{{ fixture_stale_key }}"] }
    sysadmin: { exists: false, key_lines: [] }
  missing_pin_files:
    - /etc/ssh/sshd_config.d/10-ubuntu-baseline.conf
    - /etc/apt/apt.conf.d/52-baseline-unattended-upgrades
    - /etc/systemd/journald.conf.d/10-ubuntu-baseline.conf
case_expected:
  refuses: true
  hard_failure_codes: ["SQUATTED_ACCOUNT:ansible"]
  warning_codes: [FIRST_CONVERGE_DELTA]
