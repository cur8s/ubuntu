---
- name: Validate local convergence inputs
  hosts: localhost
  gather_facts: false
  vars:
    converge_ansible_public_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"
    converge_sysadmin_public_key_file: "{{ lookup('ansible.builtin.env', 'SYSADMIN_PUB_KEY') }}"

  tasks:
    # ==========================================================================
    # Extracted Key Files
    # ==========================================================================
    - name: Validate extracted public key files
      ansible.builtin.include_tasks: tasks/validate-extracted-public-key-files.yml
      vars:
        extracted_public_key_files:
          - "{{ converge_ansible_public_key_file }}"
          - "{{ converge_sysadmin_public_key_file }}"

- name: Converge baseline Ubuntu host over ansible SSH
  hosts: all
  gather_facts: false
  remote_user: ansible
  become: true
  vars:
    converge_ansible_public_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"
    converge_sysadmin_public_key_file: "{{ lookup('ansible.builtin.env', 'SYSADMIN_PUB_KEY') }}"
    ansible_ssh_private_key_file: "{{ converge_ansible_public_key_file }}"
    converge_bootstrap_retire: "{{ lookup('ansible.builtin.env', 'BOOTSTRAP_RETIRE') | default('false', true) | bool }}"
    converge_bootstrap_user: "{{ lookup('ansible.builtin.env', 'BOOTSTRAP_USER') }}"

  pre_tasks:
    # ==========================================================================
    # Ansible Connection
    # ==========================================================================
    - name: Wait for ansible SSH access
      ansible.builtin.wait_for_connection:
        timeout: 180

    # ==========================================================================
    # Release Guard
    # ==========================================================================
    # Precondition, not verification (RFC-002): this series of the baseline
    # targets exactly one Ubuntu LTS (RFC-009); converging any other release
    # would pin 24.04-shaped config onto a host the series does not support.
    - name: Gather distribution facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution

    - name: Require the supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] | default('') == 'Ubuntu'
          - ansible_facts['distribution_version'] | default('') == '24.04'
        fail_msg: >-
          This baseline series targets Ubuntu 24.04 LTS only (RFC-009);
          found {{ ansible_facts['distribution'] | default('unknown') }}
          {{ ansible_facts['distribution_version'] | default('unknown') }}.

  # ==========================================================================
  # Baseline Roles
  # ==========================================================================
  roles:
    - role: users
      vars:
        ubuntu_users_ansible_public_key: "{{ lookup('ansible.builtin.file', converge_ansible_public_key_file) | trim }}"
        ubuntu_users_sysadmin_public_key: "{{ lookup('ansible.builtin.file', converge_sysadmin_public_key_file) | trim }}"

    - role: ssh

    - role: unattended_upgrades

    - role: journald

  post_tasks:
    # ==========================================================================
    # Validate Baseline Access
    # ==========================================================================
    - name: Validate ansible SSH and sudo access
      ansible.builtin.include_tasks: tasks/validate-ssh-sudo-access.yml
      vars:
        user_name: ansible
        public_key_file: "{{ converge_ansible_public_key_file }}"
        # hostvars lookup, not bare ansible_host: the probe task delegates to
        # localhost, and lazy templating would resolve bare connection vars
        # against the delegate instead of this host.
        target_host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"

    - name: Validate sysadmin SSH and sudo access
      ansible.builtin.include_tasks: tasks/validate-ssh-sudo-access.yml
      vars:
        user_name: sysadmin
        public_key_file: "{{ converge_sysadmin_public_key_file }}"
        # hostvars lookup, not bare ansible_host: the probe task delegates to
        # localhost, and lazy templating would resolve bare connection vars
        # against the delegate instead of this host.
        target_host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"

    # ==========================================================================
    # Bootstrap Retirement (opt-in)
    # ==========================================================================
    # Gated per environment: dev keeps the provider bootstrap door as a debug
    # path, prod retires it. Deliberately AFTER the validations above — the
    # provider path is only removed once replacement access is proven
    # (RFC-004: Identity and Trust).
    - name: Retire provider bootstrap user
      ansible.builtin.include_role:
        name: bootstrap_retirement
      vars:
        ubuntu_bootstrap_user: "{{ converge_bootstrap_user }}"
      when: converge_bootstrap_retire
