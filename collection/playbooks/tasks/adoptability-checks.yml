---
# Shared adoptability checks (RFC-007: Adoption). Read-only: probes state,
# accumulates a verdict, renders it, and refuses on any hard failure —
# writes nothing. Shared by cur8s.ubuntu.adoptable (the assessment) and
# cur8s.ubuntu.adopt (which must refuse on the same grounds before adding).
#
# Inputs: adopt_ansible_public_key_file, adopt_sysadmin_public_key_file —
# controller-side paths to the expected baseline public keys.

- name: Gather distribution facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - distribution

- name: Initialize the verdict
  ansible.builtin.set_fact:
    adopt_hard_failures: []
    adopt_warnings: []
    adopt_account_states: {}

# ==========================================================================
# Hard failure: unsupported release
# ==========================================================================
- name: Check the Ubuntu release
  ansible.builtin.set_fact:
    adopt_hard_failures: >-
      {{ adopt_hard_failures + ['unsupported release: '
         ~ (ansible_facts['distribution'] | default('unknown')) ~ ' '
         ~ (ansible_facts['distribution_version'] | default(''))
         ~ ' — this series targets Ubuntu 24.04 (RFC-010)'] }}
  when: >-
    not (ansible_facts['distribution'] | default('') == 'Ubuntu'
         and ansible_facts['distribution_version'] | default('') == '24.04')

# ==========================================================================
# Hard failures: drop-in directories that would be silently ignored
# ==========================================================================
- name: Check sshd_config includes sshd_config.d
  ansible.builtin.command:
    argv: ["grep", "-Eq", '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf', "/etc/ssh/sshd_config"]
  register: adopt_sshd_include
  changed_when: false
  failed_when: adopt_sshd_include.rc not in [0, 1]

- name: Record missing sshd include
  ansible.builtin.set_fact:
    adopt_hard_failures: >-
      {{ adopt_hard_failures + ['sshd_config does not Include sshd_config.d — the baseline SSH policy drop-in would be silently ignored'] }}
  when: adopt_sshd_include.rc != 0

- name: Check sudoers includes sudoers.d
  ansible.builtin.command:
    argv: ["grep", "-Eq", '^[#@]includedir\s+/etc/sudoers\.d', "/etc/sudoers"]
  register: adopt_sudoers_include
  changed_when: false
  failed_when: adopt_sudoers_include.rc not in [0, 1]

- name: Record missing sudoers include
  ansible.builtin.set_fact:
    adopt_hard_failures: >-
      {{ adopt_hard_failures + ['sudoers does not include sudoers.d — the per-account sudo rules would be inert'] }}
  when: adopt_sudoers_include.rc != 0

# ==========================================================================
# Hard failure: squatted baseline accounts
# ==========================================================================
- name: Probe baseline accounts
  ansible.builtin.shell: |
    set -u
    if entry="$(getent passwd {{ adopt_probe.name }})"; then
      home="$(printf '%s' "$entry" | cut -d: -f6)"
      echo "EXISTS"
      cat "$home/.ssh/authorized_keys" "$home/.ssh/authorized_keys2" 2>/dev/null || true
    else
      echo "ABSENT"
    fi
  changed_when: false
  register: adopt_account_probes
  loop:
    - { name: ansible, key_file: "{{ adopt_ansible_public_key_file }}" }
    - { name: sysadmin, key_file: "{{ adopt_sysadmin_public_key_file }}" }
  loop_control:
    loop_var: adopt_probe
    label: "{{ adopt_probe.name }}"

- name: Classify baseline accounts
  ansible.builtin.set_fact:
    adopt_account_states: "{{ adopt_account_states | combine({item.adopt_probe.name: account_state}) }}"
    adopt_hard_failures: "{{ adopt_hard_failures + ([] if account_ok else [account_problem]) }}"
  vars:
    account_exists: "{{ item.stdout_lines[0] == 'EXISTS' }}"
    key_lines: "{{ item.stdout_lines[1:] | reject('match', '^\\s*(#|$)') | list }}"
    expected_prefix: "{{ (lookup('ansible.builtin.file', item.adopt_probe.key_file).split())[0:2] | join(' ') }}"
    unexpected_keys: "{{ key_lines | reject('search', expected_prefix | regex_escape) | list }}"
    matching_keys: "{{ key_lines | select('search', expected_prefix | regex_escape) | list }}"
    account_ok: "{{ (not account_exists) or (unexpected_keys | length == 0 and matching_keys | length > 0) }}"
    account_state: >-
      {{ 'absent — adopt will create it' if not account_exists
         else ('baseline shape — already adopted' if account_ok else 'SQUATTED') }}
    account_problem: >-
      squatted account {{ item.adopt_probe.name }}: exists with
      {{ unexpected_keys | length }} key(s) the baseline did not put there{{
      ' and no baseline key' if matching_keys | length == 0 else '' }} —
      never merged into, never stripped; a human resolves this. A stale key
      from an earlier rotation reads as unexpected on purpose (RFC-007).
  loop: "{{ adopt_account_probes.results }}"
  loop_control:
    label: "{{ item.adopt_probe.name }}"

# ==========================================================================
# Warnings: what the first converge will change
# ==========================================================================
- name: Probe effective sshd password authentication
  ansible.builtin.command:
    argv: ["sshd", "-T"]
  changed_when: false
  register: adopt_sshd_effective

- name: Record password authentication warning
  ansible.builtin.set_fact:
    adopt_warnings: >-
      {{ adopt_warnings + ['password authentication is enabled — converge will disable it after adopt has proven key access'] }}
  when: "'passwordauthentication yes' in adopt_sshd_effective.stdout"

- name: Find sshd drop-ins sorting before the baseline drop-in
  ansible.builtin.shell: |
    ls -1 /etc/ssh/sshd_config.d/ 2>/dev/null | awk '$0 < "10-ubuntu-baseline.conf"' || true
  changed_when: false
  register: adopt_competing_dropins

- name: Record competing drop-in warning
  ansible.builtin.set_fact:
    adopt_warnings: >-
      {{ adopt_warnings + ['sshd drop-ins sort before the baseline drop-in and would win conflicts: ' ~ (adopt_competing_dropins.stdout_lines | join(', '))] }}
  when: adopt_competing_dropins.stdout_lines | length > 0

- name: Check for a pending reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: adopt_reboot_required

- name: Record pending reboot warning
  ansible.builtin.set_fact:
    adopt_warnings: "{{ adopt_warnings + ['the OS already flags a pending reboot'] }}"
  when: adopt_reboot_required.stat.exists

- name: Check for baseline-owned files not yet present
  ansible.builtin.stat:
    path: "{{ item }}"
  register: adopt_pin_files
  loop:
    - /etc/ssh/sshd_config.d/10-ubuntu-baseline.conf
    - /etc/apt/apt.conf.d/52-baseline-unattended-upgrades
    - /etc/systemd/journald.conf.d/10-ubuntu-baseline.conf
  loop_control:
    label: "{{ item }}"

- name: Record expected first-converge delta
  ansible.builtin.set_fact:
    adopt_warnings: >-
      {{ adopt_warnings + ['expected first-converge delta — converge will add: '
         ~ (adopt_pin_files.results | rejectattr('stat.exists') | map(attribute='item') | join(', '))] }}
  when: adopt_pin_files.results | rejectattr('stat.exists') | list | length > 0

# ==========================================================================
# Verdict
# ==========================================================================
- name: Render the verdict
  ansible.builtin.debug:
    msg: >-
      {{ ['ADOPTABILITY — ' ~ inventory_hostname]
         + ['accounts:']
         + ['  ansible: ' ~ adopt_account_states['ansible']]
         + ['  sysadmin: ' ~ adopt_account_states['sysadmin']]
         + ['hard failures:']
         + ((adopt_hard_failures | map('regex_replace', '^', '  ') | list) or ['  (none)'])
         + ['warnings:']
         + ((adopt_warnings | map('regex_replace', '^', '  ') | list) or ['  (none)']) }}

- name: Refuse on hard failures
  ansible.builtin.fail:
    msg: >-
      Not adoptable until a human acts:
      {{ adopt_hard_failures | join('; ') }}
  when: adopt_hard_failures | length > 0
