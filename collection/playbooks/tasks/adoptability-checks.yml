---
# Shared adoptability checks (RFC-007: Adoption). Read-only: probes state,
# accumulates a verdict, renders it, and refuses on any hard failure —
# writes nothing. Shared by cur8s.ubuntu.adoptable (the assessment) and
# cur8s.ubuntu.adopt (which must refuse on the same grounds before adding).
#
# Two halves, one seam: adoptability-probe.yml examines the host and
# produces the adopt_observations dict (its header documents the shape);
# adoptability-verdict.yml turns observations into coded hard failures,
# warnings, and the refusal, and never touches the host — which is what
# lets collection/tests/adoptability prove every verdict class against
# fixture observations, no VM required.

- name: Probe the host
  ansible.builtin.include_tasks: adoptability-probe.yml

- name: Judge the observations
  ansible.builtin.include_tasks: adoptability-verdict.yml
