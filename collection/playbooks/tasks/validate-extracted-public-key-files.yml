---
# ==========================================================================
# Inputs
# ==========================================================================
- name: Require extracted public key file paths
  ansible.builtin.assert:
    that:
      - item | length > 0
    fail_msg: Set ANSIBLE_PUB_KEY and SYSADMIN_PUB_KEY to your public key files (RFC-011).
  loop: "{{ extracted_public_key_files }}"

# ==========================================================================
# Extracted Key Files
# ==========================================================================
- name: Check extracted public key files
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  become: false
  register: extracted_public_key_file_stats
  loop: "{{ extracted_public_key_files }}"

- name: Require extracted public key files to exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Missing extracted public key file: {{ item.item }}"
  loop: "{{ extracted_public_key_file_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
