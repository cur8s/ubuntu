---
# ==========================================================================
# Inputs
# ==========================================================================
- name: Check SSH validation user name
  ansible.builtin.assert:
    that:
      - user_name | default('') | length > 0
    fail_msg: Set user_name.

- name: Check SSH validation public key file
  ansible.builtin.assert:
    that:
      - public_key_file | default('') | length > 0
    fail_msg: "Set public_key_file for {{ user_name }}."

- name: Check SSH validation target host
  ansible.builtin.assert:
    that:
      - target_host | default('') | length > 0
    fail_msg: "Set target_host for {{ user_name }}."

# ==========================================================================
# SSH and Sudo Access
# ==========================================================================
# This probe validates authentication and sudo, not host identity — that
# assurance belongs to the converge connection that just configured the
# host. Pinning host keys here would hard-fail whenever an address is
# reused (a local QEMU port forward, a recycled cloud IP).
- name: Validate SSH and passwordless sudo for {{ user_name }} on {{ target_host }}
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=10
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - StrictHostKeyChecking=no
      - -o
      - IdentitiesOnly=yes
      - -i
      - "{{ public_key_file }}"
      - -p
      - "{{ hostvars[inventory_hostname].ansible_port | default(22) }}"
      - "{{ user_name }}@{{ target_host }}"
      - sudo
      - -n
      - /usr/bin/true
  delegate_to: localhost
  become: false
  changed_when: false
