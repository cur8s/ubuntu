---
# ==========================================================================
# Inputs
# ==========================================================================
- name: Check SSH validation user name
  ansible.builtin.assert:
    that:
      - user_name | default('') | length > 0
    fail_msg: Set user_name.

- name: Check SSH validation public key file
  ansible.builtin.assert:
    that:
      - public_key_file | default('') | length > 0
    fail_msg: "Set public_key_file for {{ user_name }}."

- name: Check SSH validation target host
  ansible.builtin.assert:
    that:
      - target_host | default('') | length > 0
    fail_msg: "Set target_host for {{ user_name }}."

# ==========================================================================
# SSH and Sudo Access
# ==========================================================================
# This probe validates authentication and sudo, not host identity — that
# assurance belongs to the converge connection that just configured the
# host. Pinning host keys here would hard-fail whenever an address is
# reused (a local QEMU port forward, a recycled cloud IP).
#
# Agent selection: by default the probe behaves like plain ssh — the
# user's ssh config decides which agent signs (a secrets manager's
# global IdentityAgent included; that is the production path). A caller
# that must NOT use that agent — the QEMU lab, whose throwaway keys live
# in a dedicated agent — exports VALIDATE_SSH_IDENTITY_AGENT and the
# probe pins to it; pinning to $SSH_AUTH_SOCK unconditionally would
# bypass secrets-manager agents configured via ssh config.
- name: Validate SSH and passwordless sudo for {{ user_name }} on {{ target_host }}
  ansible.builtin.command:
    argv: >-
      {{
        ['ssh',
         '-o', 'BatchMode=yes',
         '-o', 'ConnectTimeout=10',
         '-o', 'UserKnownHostsFile=/dev/null',
         '-o', 'StrictHostKeyChecking=no',
         '-o', 'IdentitiesOnly=yes']
        + (['-o', 'IdentityAgent=' ~ validate_identity_agent]
           if validate_identity_agent | length > 0 else [])
        + ['-i', public_key_file,
           '-p', hostvars[inventory_hostname].ansible_port | default(22) | string,
           user_name ~ '@' ~ target_host,
           'sudo', '-n', '/usr/bin/true']
      }}
  vars:
    validate_identity_agent: "{{ lookup('ansible.builtin.env', 'VALIDATE_SSH_IDENTITY_AGENT') | default('', true) }}"
  delegate_to: localhost
  become: false
  changed_when: false
