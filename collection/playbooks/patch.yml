---
# Operator-invoked patching (RFC-003's automatic security updates cover
# only security; this applies everything else, deliberately).
#
# This play NEVER reboots. If patching leaves a reboot pending (a new
# kernel, typically), it says so and defers to cur8s.ubuntu.validate_reboot —
# the collection's only reboot path is the one that validates the host came
# back conformant (RFC-009). lock_timeout lets the run coexist with a
# concurrently firing apt-daily timer instead of failing on the dpkg lock.
- name: Patch Ubuntu packages without rebooting
  hosts: all
  remote_user: ansible
  become: true
  gather_facts: false

  vars:
    ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"

  pre_tasks:
    # ==========================================================================
    # Release Guard
    # ==========================================================================
    - name: Gather distribution facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution

    - name: Require the supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] | default('') == 'Ubuntu'
          - ansible_facts['distribution_version'] | default('') == '24.04'
        fail_msg: >-
          This baseline series targets Ubuntu 24.04 LTS only (RFC-010);
          found {{ ansible_facts['distribution'] | default('unknown') }}
          {{ ansible_facts['distribution_version'] | default('unknown') }}.
  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 300

    - name: Upgrade installed Ubuntu packages
      ansible.builtin.apt:
        upgrade: "yes"
        lock_timeout: 300

    - name: Check whether Ubuntu requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: patch_reboot_required

    - name: Report pending reboot requirement
      ansible.builtin.debug:
        msg: >-
          Patching requires a reboot. Run the validating reboot path:
          cur8s.ubuntu.validate_reboot.
      when: patch_reboot_required.stat.exists

    - name: Report no reboot required
      ansible.builtin.debug:
        msg: No reboot required.
      when: not patch_reboot_required.stat.exists
