---
# Reboot-validation acceptance test (RFC-009: Validation and Acceptance). Opt-in gate — NEVER part
# of routine converge: proves the baseline access contract and baseline services
# survive a reboot (kernel updates from unattended-upgrades included). Run it
# before lockout-sensitive changes such as bootstrap retirement.
#
# Network caveat: the reconnect involves SSH polling; run from a network that
# tolerates it (the UCG IPS classifies tight SSH bursts as scanning — see
# docs/notes/ucg-fibre-ips-ssh-blocking.md). post_reboot_delay keeps the
# polling out of the boot window so the first attempt usually succeeds.
- name: Validate local reboot-validation inputs
  hosts: localhost
  gather_facts: false
  vars:
    converge_ansible_public_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"
    converge_sysadmin_public_key_file: "{{ lookup('ansible.builtin.env', 'SYSADMIN_PUB_KEY') }}"

  tasks:
    - name: Validate extracted public key files
      ansible.builtin.include_tasks: tasks/validate-extracted-public-key-files.yml
      vars:
        extracted_public_key_files:
          - "{{ converge_ansible_public_key_file }}"
          - "{{ converge_sysadmin_public_key_file }}"

- name: Reboot baseline Ubuntu host and re-verify the baseline
  hosts: all
  gather_facts: false
  remote_user: ansible
  become: true
  vars:
    converge_ansible_public_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"
    converge_sysadmin_public_key_file: "{{ lookup('ansible.builtin.env', 'SYSADMIN_PUB_KEY') }}"
    ansible_ssh_private_key_file: "{{ converge_ansible_public_key_file }}"

  pre_tasks:
    - name: Wait for ansible SSH access
      ansible.builtin.wait_for_connection:
        timeout: 180

    # ==========================================================================
    # Release Guard
    # ==========================================================================
    - name: Gather distribution facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution

    - name: Require the supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] | default('') == 'Ubuntu'
          - ansible_facts['distribution_version'] | default('') == '24.04'
        fail_msg: >-
          This baseline series targets Ubuntu 24.04 LTS only (RFC-010);
          found {{ ansible_facts['distribution'] | default('unknown') }}
          {{ ansible_facts['distribution_version'] | default('unknown') }}.

  tasks:
    # ==========================================================================
    # Reboot
    # ==========================================================================
    - name: Reboot host and wait for it to return
      ansible.builtin.reboot:
        reboot_timeout: 600
        post_reboot_delay: 45
        connect_timeout: 10

    # ==========================================================================
    # Re-validate baseline access
    # ==========================================================================
    - name: Validate ansible SSH and sudo access after reboot
      ansible.builtin.include_tasks: tasks/validate-ssh-sudo-access.yml
      vars:
        user_name: ansible
        public_key_file: "{{ converge_ansible_public_key_file }}"
        # hostvars lookup, not bare ansible_host: the probe task delegates to
        # localhost, and lazy templating would resolve bare connection vars
        # against the delegate instead of this host.
        target_host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"

    - name: Validate sysadmin SSH and sudo access after reboot
      ansible.builtin.include_tasks: tasks/validate-ssh-sudo-access.yml
      vars:
        user_name: sysadmin
        public_key_file: "{{ converge_sysadmin_public_key_file }}"
        # hostvars lookup, not bare ansible_host: the probe task delegates to
        # localhost, and lazy templating would resolve bare connection vars
        # against the delegate instead of this host.
        target_host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"

    # ==========================================================================
    # Baseline services healthy
    # ==========================================================================
    # One unit per call, on purpose: given several units, systemctl
    # is-active exits 0 when at least ONE is active — a combined call
    # could never fail while ssh.socket was up.
    - name: Verify baseline service {{ reboot_service }} is active after reboot
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - "{{ reboot_service }}"
      changed_when: false
      loop:
        - ssh.socket
        - systemd-journald.service
        - apt-daily.timer
        - apt-daily-upgrade.timer
      loop_control:
        loop_var: reboot_service

    # The journald baseline pin promises history survives reboots; the previous
    # boot must be readable from the persistent journal.
    - name: Verify journal history survived the reboot
      ansible.builtin.command:
        argv:
          - journalctl
          - --quiet
          - --boot=-1
          - --lines=1
      changed_when: false
