---
# Retires the provider bootstrap identity (RFC-004: Identity and Trust). Converge-gated and
# OFF by default: dev environments keep the provider door as a debug path,
# prod retires it. Callers must invoke this ONLY after the ansible+sysadmin
# access validations have passed (converge.yml does so in post_tasks) —
# retiring the bootstrap path before replacement access is proven is the
# lockout scenario this ordering exists to prevent. The account is locked,
# never deleted: provider tooling may assume it exists, and deletion is not
# reversible from a converge.
- name: Check bootstrap retirement inputs
  ansible.builtin.assert:
    that:
      - ubuntu_bootstrap_user | default('') | length > 0
      - ubuntu_bootstrap_user not in ['ansible', 'sysadmin']
    fail_msg: >-
      Set ubuntu_bootstrap_user to the provider bootstrap account
      (root on DigitalOcean, ubuntu on AWS/GCP); never a baseline account.

- name: Read bootstrap user account
  ansible.builtin.getent:
    database: passwd
    key: "{{ ubuntu_bootstrap_user }}"

# ==========================================================================
# Remove the bootstrap SSH door
# ==========================================================================
- name: Remove bootstrap user authorized_keys
  ansible.builtin.file:
    path: "{{ getent_passwd[ubuntu_bootstrap_user][4] }}/.ssh/authorized_keys"
    state: absent

# ==========================================================================
# Remove the cloud-init bootstrap sudoers
# ==========================================================================
# cloud-init's combined file grants rules only to provider/bootstrap users;
# the baseline accounts use per-user files (/etc/sudoers.d/ansible,
# /etc/sudoers.d/sysadmin) written from the same source as roles/users,
# so this removal cannot touch them.
- name: Remove cloud-init bootstrap sudoers
  ansible.builtin.file:
    path: /etc/sudoers.d/90-cloud-init-users
    state: absent

# ==========================================================================
# Lock the account
# ==========================================================================
- name: Lock bootstrap user password
  ansible.builtin.user:
    name: "{{ ubuntu_bootstrap_user }}"
    password_lock: true
