# Workstation CLIs are intentionally managed outside mise for now.
# Expected commands: op, doctl, jq, ssh, ansible-playbook.
#
# Tasks are file tasks under mise-tasks/ (subdirectories namespace the task
# names: mise-tasks/do/create -> do:create). Namespaces name the thing
# operated on — a lab (do:, qemu:; future providers get aws:, azure:, ...)
# or a workstation artifact — and stay exactly one level deep. Task scripts
# must be executable or mise silently ignores them; shared helpers live in
# mise-tasks/lib.sh.

[env]
# Seconds to pause before SSH-heavy tasks (do:converge, do:update,
# do:validate-reboot, do:retire-bootstrap, example:run). 0 = no pause.
# Set >0 (e.g. 120) when running from behind an IPS/rate-limiter that drops
# SSH bursts — see docs/notes/ucg-fibre-ips-ssh-blocking.md.
SSH_SPACING_SECONDS = "0"
DROPLET_NAME = "ubuntu-ansible-lab"
DO_BOOTSTRAP_KEY_NAME = "ubuntu-bootstrap"
BOOTSTRAP_PUB_KEY = "{{config_root}}/.generated/ssh/ubuntu-bootstrap.pub"
ANSIBLE_PUB_KEY = "{{config_root}}/.generated/ssh/ubuntu-ansible.pub"
SYSADMIN_PUB_KEY = "{{config_root}}/.generated/ssh/ubuntu-sysadmin.pub"
ANSIBLE_CONFIG = "{{config_root}}/ansible.cfg"
ANSIBLE_LOCAL_TEMP = "{{config_root}}/.generated/ansible/tmp"
CLOUD_INIT_FILE = "{{config_root}}/.generated/cloud-init/ubuntu-baseline.yaml"

# Local QEMU lab (mise-tasks/qemu/): Ubuntu arm64 cloud image booted with
# hvf acceleration, first-boot config via a NoCloud seed ISO built from the
# same rendered cloud-init the droplet uses.
QEMU_VM_NAME = "ubuntu-qemu-lab"
QEMU_SSH_PORT = "2222"
QEMU_CPUS = "4"
QEMU_MEMORY = "4G"
QEMU_DISK_SIZE = "20G"
QEMU_IMAGE_URL = "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-arm64.img"
QEMU_SHA256SUMS_URL = "https://cloud-images.ubuntu.com/noble/current/SHA256SUMS"
QEMU_CACHE_DIR = "{{config_root}}/.generated/qemu/cache"
QEMU_VM_DIR = "{{config_root}}/.generated/qemu/vm"
