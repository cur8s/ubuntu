# Workstation CLIs are intentionally managed outside mise for now.
# Expected commands: ssh, ansible-playbook, git, qemu (Homebrew, Apple
# Silicon). The cloud integration folders list their own extras (doctl,
# jq, op).
#
# Tasks are file tasks under mise-tasks/ (directories namespace the names:
# mise-tasks/qemu/vm/create -> qemu:vm:create). Grammar:
# <object>:<action> — every task here acts on the local QEMU lab, the
# repo's only proof plane; cloud harnesses are self-contained
# consumer-shaped folders that live with the operator's cloud custody
# (the folder is the namespace; the DigitalOcean one is in repo history
# at b0ba5ff). Objects are vm (the machine, provider plane), host
# (baseline operations on the managed system, via the collection
# playbooks), ssh (shell access, by user), test (examples). Workflows
# where the lab itself is the object (prep, up, clean) take no object
# segment. A namespace must have
# multiple real members. Task scripts must be executable or mise silently
# ignores them; shared helpers live in mise-tasks/lib.sh.

[env]
ANSIBLE_CONFIG = "{{config_root}}/ansible.cfg"
ANSIBLE_LOCAL_TEMP = "{{config_root}}/.generated/ansible/tmp"

# Local QEMU lab: the VM mechanics live in mise-tasks/vendor/qemu-vm.sh
# (a single vendored file — image, binary, and acceleration follow the
# host: hvf on macOS, KVM on Linux/CI); the mise tasks wrap it with
# these settings and the same rendered cloud-init a cloud host uses.
# QVM_* is qemu-vm.sh's own interface — set directly, no
# mapping layer. Only values that differ from the script's defaults
# appear: state lives under .generated/ (the house convention; clean
# wipes one tree), the VM carries the lab's name, and the port is here
# because the tasks' narration reads the same knob. Sizes and timeouts
# ride the script defaults; override per-run via environment.
QVM_NAME = "ubuntu-qemu-lab"
QVM_SSH_PORT = "2222"
QVM_CACHE_DIR = "{{config_root}}/.generated/qemu/cache"
QVM_DIR = "{{config_root}}/.generated/qemu/vm"
# The harness owns the narration: the script's informational lines are
# silenced and the tasks speak mise vocabulary (errors still print).
QVM_QUIET = "1"
# The QEMU lab uses throwaway keypairs generated on the workstation
# (RFC-004: ephemeral test credentials) so the local loop needs no
# 1Password approvals; qemu tasks point the key env vars here. The
# DigitalOcean integration folder keeps the vault-held keys.
QEMU_KEYS_DIR = "{{config_root}}/.generated/qemu/keys"
QEMU_CLOUD_INIT_FILE = "{{config_root}}/.generated/cloud-init/ubuntu-baseline-qemu.yaml"
