# Workstation CLIs are intentionally managed outside mise for now.
# Expected commands: ssh, ansible-playbook, git, qemu (Homebrew, Apple
# Silicon). The cloud integration folders list their own extras (doctl,
# jq, op).
#
# Tasks are file tasks under mise-tasks/ (directories namespace the names:
# mise-tasks/qemu/vm/create -> qemu:vm:create). Grammar:
# <provider>:<object>:<action> — qemu is the local lab provider; cloud
# providers are self-contained child configs under test/integration/
# (the folder is the namespace: work inside it, or drive it with mise -C).
# Objects are vm (the machine, provider plane), host (baseline
# operations on the managed system, via the collection playbooks), ssh
# (shell access, by user), test (examples). The test:integration: family
# drives the integration folders end to end. Workflows where the provider itself
# is the object (prep, up) take no object segment. A namespace must have
# multiple real members. Task scripts must be executable or mise silently
# ignores them; shared helpers live in mise-tasks/lib.sh.

[env]
# Seconds to pause before SSH-heavy tasks (the example runners). 0 = no
# pause. Set >0 (e.g. 120) when running from behind an IPS/rate-limiter
# that drops SSH bursts — see docs/notes/ucg-fibre-ips-ssh-blocking.md.
SSH_SPACING_SECONDS = "0"
ANSIBLE_CONFIG = "{{config_root}}/ansible.cfg"
ANSIBLE_LOCAL_TEMP = "{{config_root}}/.generated/ansible/tmp"

# Local QEMU lab (mise-tasks/qemu/): Ubuntu arm64 cloud image booted with
# hvf acceleration, first-boot config via a NoCloud seed ISO built from the
# same rendered cloud-init the droplet uses.
QEMU_VM_NAME = "ubuntu-qemu-lab"
QEMU_SSH_PORT = "2222"
QEMU_CPUS = "4"
QEMU_MEMORY = "4G"
QEMU_DISK_SIZE = "20G"
QEMU_IMAGE_URL = "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-arm64.img"
QEMU_SHA256SUMS_URL = "https://cloud-images.ubuntu.com/noble/current/SHA256SUMS"
QEMU_CACHE_DIR = "{{config_root}}/.generated/qemu/cache"
QEMU_VM_DIR = "{{config_root}}/.generated/qemu/vm"
# The QEMU lab uses throwaway keypairs generated on the workstation
# (RFC-004: ephemeral lab credentials) so the local loop needs no
# 1Password approvals; qemu tasks point the key env vars here. The
# DigitalOcean integration folder keeps the vault-held keys.
QEMU_KEYS_DIR = "{{config_root}}/.generated/qemu/keys"
QEMU_CLOUD_INIT_FILE = "{{config_root}}/.generated/cloud-init/ubuntu-baseline-qemu.yaml"
