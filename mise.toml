# Workstation CLIs are intentionally managed outside mise for now.
# Expected commands: op, doctl, jq, ssh, ansible-playbook.

[env]
DROPLET_NAME = "ubuntu-ansible-lab"
DO_BOOTSTRAP_KEY_NAME = "ubuntu-bootstrap"
BOOTSTRAP_PUB_KEY = "{{config_root}}/.generated/ssh/ubuntu-bootstrap.pub"
ANSIBLE_PUB_KEY = "{{config_root}}/.generated/ssh/ubuntu-ansible.pub"
SYSADMIN_PUB_KEY = "{{config_root}}/.generated/ssh/ubuntu-sysadmin.pub"
ANSIBLE_CONFIG = "{{config_root}}/ansible.cfg"
ANSIBLE_LOCAL_TEMP = "{{config_root}}/.generated/ansible/tmp"
CLOUD_INIT_FILE = "{{config_root}}/.generated/cloud-init/ubuntu-baseline.yaml"

[tasks."key:extract"]
description = "Extract Ubuntu SSH public keys from 1Password into .generated/ssh"
quiet = true
run = '''
echo "Extracting Ubuntu SSH public keys from 1Password into .generated/ssh"
mkdir -p "$(dirname "$BOOTSTRAP_PUB_KEY")"

op read --force --out-file "$BOOTSTRAP_PUB_KEY" "op://devops/ubuntu-bootstrap/public key"
op read --force --out-file "$ANSIBLE_PUB_KEY" "op://devops/ubuntu-ansible/public key"
op read --force --out-file "$SYSADMIN_PUB_KEY" "op://devops/ubuntu-sysadmin/public key"
'''

[tasks."key:upload"]
description = "Upload the bootstrap SSH public key to DigitalOcean"
run = '''
doctl compute ssh-key import "$DO_BOOTSTRAP_KEY_NAME" \
  --public-key-file "$BOOTSTRAP_PUB_KEY" \
  --format ID,Name
'''

[tasks."key:delete"]
description = "Delete the bootstrap SSH public key from DigitalOcean"
confirm = "Delete the bootstrap SSH public key from DigitalOcean? This cannot be undone."
run = '''
bootstrap_key_id="$(doctl compute ssh-key list --output json | jq -r --arg name "$DO_BOOTSTRAP_KEY_NAME" '.[] | select(.name == $name) | .id')"

doctl compute ssh-key delete "$bootstrap_key_id" --force
'''

[tasks."cloud-init:render"]
description = "Render cloud-init user-data from extracted public keys into .generated"
quiet = true
run = 'sh "$MISE_CONFIG_ROOT/playbooks/cloud-init/render.sh"'

[tasks."vm:create"]
description = "Create the DigitalOcean Ubuntu test VM"
quiet = true
depends = ["cloud-init:render"]
run = '''
echo "Creating the DigitalOcean Ubuntu test VM"
droplet_count="$(doctl compute droplet list "$DROPLET_NAME" --output json | jq length)"
bootstrap_key_id="$(doctl compute ssh-key list --output json | jq -r --arg name "$DO_BOOTSTRAP_KEY_NAME" '.[] | select(.name == $name) | .id')"

if [ "$droplet_count" -ne 0 ]; then
  echo "A DigitalOcean Droplet named $DROPLET_NAME already exists." >&2
  exit 1
fi

doctl compute droplet create "$DROPLET_NAME" \
  --image ubuntu-24-04-x64 \
  --size s-1vcpu-1gb \
  --region tor1 \
  --ssh-keys "$bootstrap_key_id" \
  --user-data-file "$CLOUD_INIT_FILE" \
  --format ID,Name,PublicIPv4,Status,Image \
  --wait
'''

[tasks."vm:list"]
description = "List matching DigitalOcean Ubuntu test VMs"
quiet = true
run = '''
doctl compute droplet list "$DROPLET_NAME" \
  --format ID,Name,PublicIPv4,Status,Image
'''

[tasks."ssh:root"]
description = "SSH to the DigitalOcean Ubuntu test VM as root before SSH lockdown"
run = '''
ssh \
  -o StrictHostKeyChecking=accept-new \
  -o IdentitiesOnly=yes \
  -i "$BOOTSTRAP_PUB_KEY" \
  "root@$(doctl compute droplet list "$DROPLET_NAME" --format PublicIPv4 --no-header)"
'''

[tasks."ssh:ansible"]
description = "SSH to the DigitalOcean Ubuntu test VM as ansible"
run = '''
ssh \
  -o StrictHostKeyChecking=accept-new \
  -o IdentitiesOnly=yes \
  -i "$ANSIBLE_PUB_KEY" \
  "ansible@$(doctl compute droplet list "$DROPLET_NAME" --format PublicIPv4 --no-header)"
'''

[tasks."ssh:sysadmin"]
description = "SSH to the DigitalOcean Ubuntu test VM as sysadmin"
run = '''
ssh \
  -o StrictHostKeyChecking=accept-new \
  -o IdentitiesOnly=yes \
  -i "$SYSADMIN_PUB_KEY" \
  "sysadmin@$(doctl compute droplet list "$DROPLET_NAME" --format PublicIPv4 --no-header)"
'''

[tasks."vm:delete"]
description = "Delete the DigitalOcean Ubuntu test VM"
confirm = "Delete the DigitalOcean Ubuntu test VM? This cannot be undone."
run = '''
doctl compute droplet delete "$DROPLET_NAME" --force
'''

[tasks."vm:reboot"]
description = "Reboot the DigitalOcean Ubuntu test VM"
run = '''
doctl compute droplet-action reboot "$(doctl compute droplet list "$DROPLET_NAME" --format ID --no-header)" --wait
'''

[tasks."vm:init"]
description = "Initialize the DigitalOcean Ubuntu test VM with baseline users and SSH lockdown"
run = '''
mkdir -p "$ANSIBLE_LOCAL_TEMP"

ansible-playbook \
  -i "$(doctl compute droplet list "$DROPLET_NAME" --format PublicIPv4 --no-header)," \
  "$MISE_CONFIG_ROOT/playbooks/initialize.yml"
'''

[tasks."vm:converge"]
description = "Converge the DigitalOcean Ubuntu test VM over ansible SSH"
run = '''
mkdir -p "$ANSIBLE_LOCAL_TEMP"

ansible-playbook \
  -i "$(doctl compute droplet list "$DROPLET_NAME" --format PublicIPv4 --no-header)," \
  "$MISE_CONFIG_ROOT/playbooks/converge.yml"
'''

[tasks.clean]
description = "Delete the DigitalOcean Ubuntu test VM and generated local files"
depends = ["vm:delete"]
run = '''
rm -rf "$MISE_CONFIG_ROOT/.generated"
'''
