# Workstation CLIs are intentionally managed outside mise for now.
# Expected commands: op, ansible, doctl.

[env]
DO_TEST_VM_NAME = "cur8s-ubuntu-test"
TAILSCALE_TEST_VM_HOST = "cur8s-ubuntu-test.puma-mora.ts.net"
DO_SSH_KEY_ID = "57436897"
OP_ADMIN_SSH_KEY_VAULT = "Development"
OP_ADMIN_SSH_KEY_ITEM = "cur8s-ubuntu-lab"
OP_ADMIN_SSH_PUBLIC_KEY_FIELD = "public key"
ADMIN_SSH_PUBLIC_KEY_TEMPLATE = "provisioning/ssh/admin-public-key.pub.tpl"
ADMIN_SSH_PUBLIC_KEY_RENDERED = ".generated/ssh/admin.pub"
OP_ANSIBLE_SSH_KEY_VAULT = "Development"
OP_ANSIBLE_SSH_KEY_ITEM = "ansible"
OP_ANSIBLE_SSH_PUBLIC_KEY_FIELD = "public key"
ANSIBLE_SSH_PUBLIC_KEY_TEMPLATE = "provisioning/ssh/ansible-public-key.pub.tpl"
ANSIBLE_SSH_PUBLIC_KEY_RENDERED = ".generated/ssh/ansible.pub"
OP_ADMIN_USER_SSH_KEY_VAULT = "Development"
OP_ADMIN_USER_SSH_KEY_ITEM = "admin"
OP_ADMIN_USER_SSH_PUBLIC_KEY_FIELD = "public key"
ADMIN_USER_SSH_PUBLIC_KEY_TEMPLATE = "provisioning/ssh/admin-user-public-key.pub.tpl"
ADMIN_USER_SSH_PUBLIC_KEY_RENDERED = ".generated/ssh/admin-user.pub"
OP_SSH_AGENT_SOCKET = ".generated/ssh/1password-agent.sock"
OP_TAILSCALE_AUTHKEY_VAULT = "Development"
OP_TAILSCALE_AUTHKEY_ITEM = "ubuntu-tailscale-auth-key"
OP_TAILSCALE_AUTHKEY_FIELD = "password"

[tasks.prepare-1password-ssh-agent]
description = "Create a local path to the 1Password SSH agent socket"
run = '''
mkdir -p "$(dirname "$OP_SSH_AGENT_SOCKET")"
ln -sf "$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock" "$OP_SSH_AGENT_SOCKET"
'''

[tasks.render-admin-ssh-public-key]
description = "Render the administrator SSH public key from 1Password"
run = '''
mkdir -p "$(dirname "$ADMIN_SSH_PUBLIC_KEY_RENDERED")"
op inject \
  --in-file "$ADMIN_SSH_PUBLIC_KEY_TEMPLATE" \
  --out-file "$ADMIN_SSH_PUBLIC_KEY_RENDERED" \
  --force \
  --file-mode 0600
'''

[tasks.render-ansible-ssh-public-key]
description = "Render the ansible SSH public key from 1Password"
run = '''
mkdir -p "$(dirname "$ANSIBLE_SSH_PUBLIC_KEY_RENDERED")"
op inject \
  --in-file "$ANSIBLE_SSH_PUBLIC_KEY_TEMPLATE" \
  --out-file "$ANSIBLE_SSH_PUBLIC_KEY_RENDERED" \
  --force \
  --file-mode 0600
'''

[tasks.render-admin-user-ssh-public-key]
description = "Render the admin user SSH public key from 1Password"
run = '''
mkdir -p "$(dirname "$ADMIN_USER_SSH_PUBLIC_KEY_RENDERED")"
op inject \
  --in-file "$ADMIN_USER_SSH_PUBLIC_KEY_TEMPLATE" \
  --out-file "$ADMIN_USER_SSH_PUBLIC_KEY_RENDERED" \
  --force \
  --file-mode 0600
'''

[tasks.render-initialize-ssh-public-keys]
description = "Render ansible and admin SSH public keys needed to initialize a host"
run = '''
mkdir -p "$(dirname "$ANSIBLE_SSH_PUBLIC_KEY_RENDERED")"
op inject \
  --in-file "$ANSIBLE_SSH_PUBLIC_KEY_TEMPLATE" \
  --out-file "$ANSIBLE_SSH_PUBLIC_KEY_RENDERED" \
  --force \
  --file-mode 0600

mkdir -p "$(dirname "$ADMIN_USER_SSH_PUBLIC_KEY_RENDERED")"
op inject \
  --in-file "$ADMIN_USER_SSH_PUBLIC_KEY_TEMPLATE" \
  --out-file "$ADMIN_USER_SSH_PUBLIC_KEY_RENDERED" \
  --force \
  --file-mode 0600
'''

[tasks.test-vm-create]
description = "Create the DigitalOcean test VM"
run = '''
doctl compute droplet create "$DO_TEST_VM_NAME" \
  --image "ubuntu-24-04-x64" \
  --size "s-1vcpu-1gb" \
  --region "tor1" \
  --ssh-keys "$DO_SSH_KEY_ID" \
  --wait \
  --format ID,Name,PublicIPv4,Status \
  --no-header
'''

[tasks.test-vm-ssh]
description = "SSH to the DigitalOcean test VM"
run = '''
ssh \
  -o StrictHostKeyChecking=accept-new \
  -o ConnectionAttempts=30 \
  "root@$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)"
'''

[tasks.test-vm-tailscale-ssh]
description = "Test Tailscale SSH to the DigitalOcean test VM"
run = '''
ssh \
  -o StrictHostKeyChecking=accept-new \
  -o PreferredAuthentications=none \
  -o PubkeyAuthentication=no \
  -o PasswordAuthentication=no \
  -o KbdInteractiveAuthentication=no \
  -o NumberOfPasswordPrompts=0 \
  "root@$TAILSCALE_TEST_VM_HOST" \
  true
'''

[tasks.test-vm-status]
description = "Show the DigitalOcean test VM status"
run = '''
doctl compute droplet get "$DO_TEST_VM_NAME" \
  --format ID,Name,PublicIPv4,Status \
  --no-header
'''

[tasks.test-vm-converge]
description = "Converge the baseline on the DigitalOcean test VM"
depends = ["render-admin-ssh-public-key"]
run = '''
ansible-playbook \
  -i "$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)," \
  --user root \
  --ssh-common-args "-o StrictHostKeyChecking=accept-new" \
  --extra-vars "admin_ssh_public_key_file=$(pwd)/$ADMIN_SSH_PUBLIC_KEY_RENDERED" \
  ansible/playbooks/baseline/converge.yml
'''

[tasks.test-vm-init]
description = "Initialize ansible and admin SSH access on the DigitalOcean test VM"
depends = ["prepare-1password-ssh-agent", "render-initialize-ssh-public-keys"]
run = '''
ansible-playbook \
  -i "$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)," \
  --user root \
  --ssh-common-args "-o StrictHostKeyChecking=accept-new" \
  --extra-vars "baseline_ansible_public_key_file=$(pwd)/$ANSIBLE_SSH_PUBLIC_KEY_RENDERED" \
  --extra-vars "baseline_admin_public_key_file=$(pwd)/$ADMIN_USER_SSH_PUBLIC_KEY_RENDERED" \
  --extra-vars "baseline_access_identity_agent=$(pwd)/$OP_SSH_AGENT_SOCKET" \
  ansible/playbooks/baseline/initialize.yml
'''

[tasks.test-vm-ssh-ansible]
description = "Test ansible SSH access to the DigitalOcean test VM"
depends = ["prepare-1password-ssh-agent", "render-ansible-ssh-public-key"]
run = '''
ssh \
  -o BatchMode=yes \
  -o StrictHostKeyChecking=accept-new \
  -o IdentitiesOnly=yes \
  -o "IdentityAgent=$(pwd)/$OP_SSH_AGENT_SOCKET" \
  -i "$ANSIBLE_SSH_PUBLIC_KEY_RENDERED" \
  "ansible@$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)" \
  sudo -n /usr/bin/true
'''

[tasks.test-vm-ssh-admin]
description = "Test admin SSH access to the DigitalOcean test VM"
depends = ["prepare-1password-ssh-agent", "render-admin-user-ssh-public-key"]
run = '''
ssh \
  -o BatchMode=yes \
  -o StrictHostKeyChecking=accept-new \
  -o IdentitiesOnly=yes \
  -o "IdentityAgent=$(pwd)/$OP_SSH_AGENT_SOCKET" \
  -i "$ADMIN_USER_SSH_PUBLIC_KEY_RENDERED" \
  "admin@$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)" \
  sudo -n /usr/bin/true
'''

[tasks.test-vm-install-docker]
description = "Install Docker on the DigitalOcean test VM"
run = '''
ansible-playbook \
  -i "$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)," \
  --user root \
  --ssh-common-args "-o StrictHostKeyChecking=accept-new" \
  ansible/playbooks/examples/install-docker.yml
'''

[tasks.test-vm-install-postgres]
description = "Install PostgreSQL on the DigitalOcean test VM"
run = '''
ansible-playbook \
  -i "$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)," \
  --user root \
  --ssh-common-args "-o StrictHostKeyChecking=accept-new" \
  ansible/playbooks/examples/install-postgres.yml
'''

[tasks.test-vm-install-zot]
description = "Install zot on the DigitalOcean test VM"
run = '''
ansible-playbook \
  -i "$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)," \
  --user root \
  --ssh-common-args "-o StrictHostKeyChecking=accept-new" \
  ansible/playbooks/examples/install-zot.yml
'''

[tasks.test-vm-install-tailscale]
description = "Install Tailscale on the DigitalOcean test VM"
run = '''
ansible-playbook \
  -i "$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)," \
  --user root \
  --ssh-common-args "-o StrictHostKeyChecking=accept-new" \
  ansible/playbooks/examples/install-tailscale.yml
'''

[tasks.test-vm-join-tailscale]
description = "Join the DigitalOcean test VM to Tailscale"
run = '''
TAILSCALE_AUTHKEY="$(
  op read "op://$OP_TAILSCALE_AUTHKEY_VAULT/$OP_TAILSCALE_AUTHKEY_ITEM/$OP_TAILSCALE_AUTHKEY_FIELD"
)"
export TAILSCALE_AUTHKEY

ansible-playbook \
  -i "$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)," \
  --user root \
  --ssh-common-args "-o StrictHostKeyChecking=accept-new" \
  ansible/playbooks/examples/join-tailscale.yml
'''

[tasks.test-vm-install-osquery]
description = "Install osquery on the DigitalOcean test VM"
run = '''
ansible-playbook \
  -i "$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)," \
  --user root \
  --ssh-common-args "-o StrictHostKeyChecking=accept-new" \
  ansible/playbooks/examples/install-osquery.yml
'''

[tasks.test-vm-install-lynis]
description = "Install Lynis on the DigitalOcean test VM"
run = '''
ansible-playbook \
  -i "$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)," \
  --user root \
  --ssh-common-args "-o StrictHostKeyChecking=accept-new" \
  ansible/playbooks/examples/install-lynis.yml
'''

[tasks.test-vm-reboot-if-needed]
description = "Reboot the DigitalOcean test VM if Ubuntu requires it"
run = '''
ansible-playbook \
  -i "$(doctl compute droplet get "$DO_TEST_VM_NAME" --format PublicIPv4 --no-header)," \
  --user root \
  --ssh-common-args "-o StrictHostKeyChecking=accept-new" \
  ansible/playbooks/baseline/packages/reboot-if-needed.yml
'''

[tasks.test-vm-delete]
description = "Delete the DigitalOcean test VM"
confirm = "Delete the DigitalOcean test VM? This cannot be undone."
run = '''
doctl compute droplet delete "$DO_TEST_VM_NAME" --force
'''
