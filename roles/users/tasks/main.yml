---
# Account names are fixed baseline policy. Only the public keys are caller inputs.
# ==========================================================================
# Inputs
# ==========================================================================
- name: Validate ansible user SSH key
  ansible.builtin.include_tasks: validate-user.yml
  vars:
    ubuntu_user_name: ansible
    ubuntu_user_public_key: "{{ ubuntu_users_ansible_public_key | default('') }}"

- name: Validate admin user SSH key
  ansible.builtin.include_tasks: validate-user.yml
  vars:
    ubuntu_user_name: admin
    ubuntu_user_public_key: "{{ ubuntu_users_admin_public_key | default('') }}"

# ==========================================================================
# Ansible User
# ==========================================================================
- name: Configure ansible user
  ansible.builtin.include_tasks: configure-user.yml
  vars:
    ubuntu_user_name: ansible
    ubuntu_user_public_key: "{{ ubuntu_users_ansible_public_key }}"

# ==========================================================================
# Admin User
# ==========================================================================
- name: Configure admin user
  ansible.builtin.include_tasks: configure-user.yml
  vars:
    ubuntu_user_name: admin
    ubuntu_user_public_key: "{{ ubuntu_users_admin_public_key }}"
