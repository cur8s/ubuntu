---
# ==========================================================================
# Inputs
# ==========================================================================
- name: Check user public key
  ansible.builtin.assert:
    that:
      - (ubuntu_user_public_key | default('')) is match('^ssh-ed25519 [A-Za-z0-9+/]+={0,3}( .*)?$')
    fail_msg: "SSH public key for {{ ubuntu_user_name }} must be an ssh-ed25519 OpenSSH public key."
