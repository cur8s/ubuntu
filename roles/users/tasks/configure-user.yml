---
# ==========================================================================
# Create User Account 
# ==========================================================================
- name: Create user
  ansible.builtin.user:
    name: "{{ ubuntu_user_name }}"
    state: present
    shell: /bin/bash
    create_home: true
    password_lock: true

# ==========================================================================
# Grant Sudo Access
# ==========================================================================
- name: Install passwordless sudo rule
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ ubuntu_user_name }}"
    owner: root
    group: root
    mode: "0440"
    content: "{{ ubuntu_user_name }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: /usr/sbin/visudo -cf %s

# ==========================================================================
# Verify Sudo Access
# ==========================================================================
- name: Verify passwordless sudo
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ ubuntu_user_name }}"
      - sudo
      - -n
      - /usr/bin/true
  changed_when: false

# ==========================================================================
# SSH Access
# ==========================================================================
- name: Install SSH public key
  ansible.posix.authorized_key:
    user: "{{ ubuntu_user_name }}"
    key: "{{ ubuntu_user_public_key }}"
    state: present
    manage_dir: true
