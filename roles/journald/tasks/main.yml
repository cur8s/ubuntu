---
# Baseline audit/log capture (a floor control). RFC-001 §9 scopes the floor to
# role-level attribution, so the journal must survive reboots — sshd/sudo/
# service history has to still be there after an incident. Per-person "who"
# belongs to the access layer, and forensic syscall auditing (auditd) is a
# use-case/compliance layer; neither is owned or fought here. This role only
# pins Storage=persistent: the stock Storage=auto persists solely when
# /var/log/journal happens to exist, and quietly reverts to RAM-only when it
# doesn't. Everything else (size caps, forwarding, rsyslog) stays distro
# default. No verification tasks on purpose (keep the floor close to default;
# see README for the drift experiment that informed this).
- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pin persistent journal storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-ubuntu-baseline.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by baseline.ubuntu. The journal must survive reboots;
      # runtime-only storage erases login/sudo/service history at every boot.
      [Journal]
      Storage=persistent
  notify: Restart journald

- name: Apply pending journald restart
  ansible.builtin.meta: flush_handlers

- name: Ensure journald is active
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: started
