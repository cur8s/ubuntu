---
- name: Trust bootstrap SSH key
  hosts: all
  become: true
  gather_facts: false

  vars:
    baseline_bootstrap_user: root
    baseline_bootstrap_public_key_file: "{{ lookup('env', 'BOOTSTRAP_SSH_PUBLIC_KEY_RENDERED') }}"
    baseline_bootstrap_authorized_keys_path: /root/.ssh/authorized_keys
    baseline_bootstrap_public_key_pattern: '^ssh-ed25519 [A-Za-z0-9+/]+={0,3}( .*)?$'

  tasks:
    - name: Require bootstrap SSH public key file path
      ansible.builtin.assert:
        that:
          - baseline_bootstrap_public_key_file | length > 0
        fail_msg: >-
          Set baseline_bootstrap_public_key_file or BOOTSTRAP_SSH_PUBLIC_KEY_RENDERED
          to the rendered bootstrap SSH public key path.

    - name: Read bootstrap SSH public key
      ansible.builtin.set_fact:
        baseline_bootstrap_public_key: "{{ lookup('ansible.builtin.file', baseline_bootstrap_public_key_file) | trim }}"

    - name: Assert bootstrap SSH public key format
      ansible.builtin.assert:
        that:
          - baseline_bootstrap_public_key is match(baseline_bootstrap_public_key_pattern)
        fail_msg: "Rendered bootstrap SSH public key must be an ssh-ed25519 OpenSSH public key."

    - name: Ensure bootstrap SSH directory exists
      ansible.builtin.file:
        path: "{{ baseline_bootstrap_authorized_keys_path | dirname }}"
        state: directory
        owner: "{{ baseline_bootstrap_user }}"
        group: "{{ baseline_bootstrap_user }}"
        mode: "0700"

    - name: Ensure bootstrap authorized keys file exists
      ansible.builtin.copy:
        dest: "{{ baseline_bootstrap_authorized_keys_path }}"
        content: ""
        force: false
        owner: "{{ baseline_bootstrap_user }}"
        group: "{{ baseline_bootstrap_user }}"
        mode: "0600"

    - name: Ensure bootstrap SSH key is authorized
      ansible.builtin.lineinfile:
        path: "{{ baseline_bootstrap_authorized_keys_path }}"
        line: "{{ baseline_bootstrap_public_key }}"
        state: present
        owner: "{{ baseline_bootstrap_user }}"
        group: "{{ baseline_bootstrap_user }}"
        mode: "0600"

    - name: Read bootstrap authorized keys
      ansible.builtin.slurp:
        src: "{{ baseline_bootstrap_authorized_keys_path }}"
      register: baseline_bootstrap_authorized_keys

    - name: Assert bootstrap SSH key is authorized
      ansible.builtin.assert:
        that:
          - baseline_bootstrap_public_key in (baseline_bootstrap_authorized_keys.content | b64decode)
