# DigitalOcean integration — a self-contained operational skeleton for
# running the cur8s.ubuntu baseline on a DigitalOcean droplet. It is two
# things at once: this repository's integration-test surface (driven by the
# root test:integration:digital-ocean task) and a starting point you can copy into your
# own environment — the folder reaches nothing outside itself except the
# installed collection (requirements.yml) and your CLIs.
#
# Task grammar: <object>:<action> — the directory is the provider
# namespace. Objects: vm (the droplet, provider plane), host (baseline
# operations on the managed system, 1:1 with cur8s.ubuntu.* FQCNs), ssh
# (a shell, by account), key (custody
# and the provider bootstrap key). Workflows with no object: prep
# (one-time groundwork), up (provision + converge).
#
# Expected CLIs: doctl (authenticated), jq, ansible-playbook, ssh, and op
# (1Password — the default custody wiring; the README shows how to swap it).
#
# One-time in a fresh copy: `mise trust`.

[env]
# The droplet this folder manages: one folder = one host definition.
DROPLET_NAME = "ubuntu-baseline-01"
DROPLET_IMAGE = "ubuntu-24-04-x64"
DROPLET_SIZE = "s-1vcpu-1gb"
DROPLET_REGION = "tor1"

# Custody (1Password by default — see README to swap). Only public halves
# are ever extracted to .generated/ssh; private keys live in the vault and
# its SSH agent (RFC-004: Identity and Trust).
OP_BOOTSTRAP_KEY_REF = "op://devops/ubuntu-bootstrap/public key"
OP_ANSIBLE_KEY_REF = "op://devops/ubuntu-ansible/public key"
OP_SYSADMIN_KEY_REF = "op://devops/ubuntu-sysadmin/public key"
DO_BOOTSTRAP_KEY_NAME = "ubuntu-bootstrap"
BOOTSTRAP_PUB_KEY = "{{config_root}}/.generated/ssh/ubuntu-bootstrap.pub"
ANSIBLE_PUB_KEY = "{{config_root}}/.generated/ssh/ubuntu-ansible.pub"
SYSADMIN_PUB_KEY = "{{config_root}}/.generated/ssh/ubuntu-sysadmin.pub"

# Ansible wiring. The collection resolves from this folder's own
# .generated/collections — populated by `ansible-galaxy collection install
# -r requirements.yml -p .generated/collections`. (Inside the cur8s/ubuntu
# repository the root test:integration tasks symlink the working tree there, so
# integration runs test your edits, not a pinned release.)
ANSIBLE_CONFIG = "{{config_root}}/ansible.cfg"
ANSIBLE_COLLECTIONS_PATH = "{{config_root}}/.generated/collections"
ANSIBLE_LOCAL_TEMP = "{{config_root}}/.generated/ansible/tmp"
CLOUD_INIT_FILE = "{{config_root}}/.generated/cloud-init/user-data.yaml"

# Seconds to pause before SSH-heavy tasks; set >0 (e.g. 120) behind an
# IPS/rate-limiter that drops SSH bursts.
SSH_SPACING_SECONDS = "0"
