---
- name: Bootstrap baseline Ubuntu users
  hosts: all
  gather_facts: false
  become: true
  vars:
    bootstrap_ansible_public_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"
    bootstrap_admin_public_key_file: "{{ lookup('ansible.builtin.env', 'ADMIN_PUB_KEY') }}"

  pre_tasks:
    # ==========================================================================
    # Inputs
    # ==========================================================================
    - name: Require extracted public key file paths
      ansible.builtin.assert:
        that:
          - bootstrap_ansible_public_key_file | length > 0
          - bootstrap_admin_public_key_file | length > 0
        fail_msg: Run through mise so ANSIBLE_PUB_KEY and ADMIN_PUB_KEY point at extracted public key files.

    # ==========================================================================
    # Extracted Key Files
    # ==========================================================================
    - name: Check extracted public key files
      ansible.builtin.stat:
        path: "{{ item }}"
      delegate_to: localhost
      become: false
      register: bootstrap_public_key_files
      loop:
        - "{{ bootstrap_ansible_public_key_file }}"
        - "{{ bootstrap_admin_public_key_file }}"

    - name: Require extracted public key files to exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing extracted public key file: {{ item.item }}"
      loop: "{{ bootstrap_public_key_files.results }}"
      loop_control:
        label: "{{ item.item }}"

  # ==========================================================================
  # Baseline Users
  # ==========================================================================
  roles:
    - role: users
      vars:
        ubuntu_users_ansible_public_key: "{{ lookup('ansible.builtin.file', bootstrap_ansible_public_key_file) | trim }}"
        ubuntu_users_admin_public_key: "{{ lookup('ansible.builtin.file', bootstrap_admin_public_key_file) | trim }}"
