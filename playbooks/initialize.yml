---
- name: Validate local initialization inputs
  hosts: localhost
  gather_facts: false
  vars:
    initialize_bootstrap_public_key_file: "{{ lookup('ansible.builtin.env', 'BOOTSTRAP_PUB_KEY') }}"
    initialize_ansible_public_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"
    initialize_sysadmin_public_key_file: "{{ lookup('ansible.builtin.env', 'SYSADMIN_PUB_KEY') }}"

  tasks:
    # ==========================================================================
    # Extracted Key Files
    # ==========================================================================
    - name: Validate extracted public key files
      ansible.builtin.include_tasks: tasks/validate-extracted-public-key-files.yml
      vars:
        extracted_public_key_files:
          - "{{ initialize_bootstrap_public_key_file }}"
          - "{{ initialize_ansible_public_key_file }}"
          - "{{ initialize_sysadmin_public_key_file }}"

- name: Install replacement users over bootstrap SSH
  hosts: all
  gather_facts: false
  remote_user: root
  become: true
  vars:
    initialize_bootstrap_public_key_file: "{{ lookup('ansible.builtin.env', 'BOOTSTRAP_PUB_KEY') }}"
    initialize_ansible_public_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"
    initialize_sysadmin_public_key_file: "{{ lookup('ansible.builtin.env', 'SYSADMIN_PUB_KEY') }}"
    ansible_ssh_private_key_file: "{{ initialize_bootstrap_public_key_file }}"

  pre_tasks:
    # ==========================================================================
    # Bootstrap Connection
    # ==========================================================================
    - name: Wait for bootstrap SSH access
      ansible.builtin.wait_for_connection:
        timeout: 180

  # ==========================================================================
  # Baseline Users
  # ==========================================================================
  roles:
    - role: users
      vars:
        ubuntu_users_ansible_public_key: "{{ lookup('ansible.builtin.file', initialize_ansible_public_key_file) | trim }}"
        ubuntu_users_sysadmin_public_key: "{{ lookup('ansible.builtin.file', initialize_sysadmin_public_key_file) | trim }}"

  post_tasks:
    # ==========================================================================
    # Validate Replacement Access
    # ==========================================================================
    - name: Validate ansible SSH and sudo access
      ansible.builtin.include_tasks: tasks/validate-ssh-sudo-access.yml
      vars:
        user_name: ansible
        public_key_file: "{{ initialize_ansible_public_key_file }}"
        target_host: "{{ inventory_hostname }}"

    - name: Validate sysadmin SSH and sudo access
      ansible.builtin.include_tasks: tasks/validate-ssh-sudo-access.yml
      vars:
        user_name: sysadmin
        public_key_file: "{{ initialize_sysadmin_public_key_file }}"
        target_host: "{{ inventory_hostname }}"

- name: Lock down SSH over ansible SSH
  hosts: all
  gather_facts: false
  remote_user: ansible
  become: true
  vars:
    initialize_ansible_public_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"
    initialize_sysadmin_public_key_file: "{{ lookup('ansible.builtin.env', 'SYSADMIN_PUB_KEY') }}"
    ansible_ssh_private_key_file: "{{ initialize_ansible_public_key_file }}"

  pre_tasks:
    # ==========================================================================
    # Ansible Connection
    # ==========================================================================
    - name: Wait for ansible SSH access
      ansible.builtin.wait_for_connection:
        timeout: 60

  # ==========================================================================
  # SSH Lockdown
  # ==========================================================================
  roles:
    - role: ssh

  post_tasks:
    # ==========================================================================
    # Validate Locked Down Access
    # ==========================================================================
    - name: Validate ansible SSH and sudo access after SSH lockdown
      ansible.builtin.include_tasks: tasks/validate-ssh-sudo-access.yml
      vars:
        user_name: ansible
        public_key_file: "{{ initialize_ansible_public_key_file }}"
        target_host: "{{ inventory_hostname }}"

    - name: Validate sysadmin SSH and sudo access after SSH lockdown
      ansible.builtin.include_tasks: tasks/validate-ssh-sudo-access.yml
      vars:
        user_name: sysadmin
        public_key_file: "{{ initialize_sysadmin_public_key_file }}"
        target_host: "{{ inventory_hostname }}"
