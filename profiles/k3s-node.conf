UBUNTU_BOOTSTRAP_MODULES="${UBUNTU_BOOTSTRAP_MODULES:-ssh firewall unattended-upgrades fail2ban tailscale osquery}"

UBUNTU_TARGET_CODENAME="${UBUNTU_TARGET_CODENAME:-}"

SSH_PORT="${SSH_PORT:-22}"
FIREWALL_ALLOW_TCP="${FIREWALL_ALLOW_TCP:-22 6443 10250}"
TAILSCALE_UP_FLAGS="${TAILSCALE_UP_FLAGS:---ssh}"
