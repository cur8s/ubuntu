# Conservative baseline for a fresh Ubuntu production host.

UBUNTU_BOOTSTRAP_PHASES="${UBUNTU_BOOTSTRAP_PHASES:-00-preflight 10-base-system 20-security 30-networking 40-third-party-repos 50-packages 60-services 90-verify}"
UBUNTU_BOOTSTRAP_MODULES="${UBUNTU_BOOTSTRAP_MODULES:-ssh firewall unattended-upgrades fail2ban}"

# Leave unset until the project locks a specific previous-LTS codename.
# Example: UBUNTU_TARGET_CODENAME=noble
UBUNTU_TARGET_CODENAME="${UBUNTU_TARGET_CODENAME:-}"

SSH_PORT="${SSH_PORT:-22}"
FIREWALL_ALLOW_TCP="${FIREWALL_ALLOW_TCP:-22}"
